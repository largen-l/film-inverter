<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Inverter theme maker</title>
<!--
  Film Inverter theme maker. Open this file in any browser (works offline, no install).
  Pick or import a theme, adjust it, download the .JSN file, copy it to the card at FILMINV/THEMES/.
  Then on the camera: Menu > Theme cycles through the built-in themes and the files found there.
  The camera only accepts 8.3 file names (max 8 characters + .JSN), which this page enforces.
  Theme format: see app/FilmInverter/src/com/filminverter/Theme.java. Written by Claude (Anthropic).
-->
<style>
:root{--bg:#f4f4f2;--panel:#ffffff;--ink:#1b1b1b;--dim:#5c5c5c;--line:#d9d9d6;--acc:#1f5fd1}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--ink:#ececec;--dim:#a7a7a7;--line:#333;--acc:#7cb2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 24px 4px}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--dim)}
main{display:flex;flex-wrap:wrap;gap:24px;padding:16px 24px 32px}
.controls{flex:1 1 320px;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.preview{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:12px}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
label span{color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
input[type=range]{width:110px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.colour{display:flex;align-items:center;gap:8px}
.colour output{width:84px;font:12px ui-monospace,Consolas,monospace;color:var(--dim)}
.screen-wrap{width:100%;max-width:640px}
.screen{position:relative;width:640px;height:480px;transform-origin:0 0;overflow:hidden;border-radius:6px;background:#000}
.lv{position:absolute;inset:0;background:linear-gradient(180deg,#a9bccb 0%,#cfd8dc 44%,#78845f 45%,#4b5437 100%)}
.pills{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px}
.pill{padding:4px 10px;font-size:13px;border-radius:14px}
.spacer{flex:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;align-items:center;gap:14px;padding:0 16px}
.menu{width:64px;height:52px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid}
.mid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;gap:6px}
.chip{padding:6px 11px;font-size:13px;border:1px solid}
.sl{display:flex;align-items:center;gap:8px}
.track{position:relative;flex:1;height:4px;margin:0 22px;border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;width:18%;border-radius:2px}
.thumb{position:absolute;left:18%;top:-10px;width:24px;height:24px;margin-left:-12px;border-radius:50%}
.val{width:84px;text-align:right;font:15px ui-monospace,Consolas,monospace}
.shutter{width:76px;height:76px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center}
.shutter i{display:block;width:58px;height:58px;border-radius:50%}
.note{font-size:13px;color:var(--dim)}
pre{margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>Film Inverter theme maker</h1>
  <p>Design a colour theme for the camera app, then copy the file to <b>FILMINV/THEMES/</b> on the card.</p>
</header>
<main>
  <section class="controls" aria-label="Theme settings">
    <div class="row">
      <label for="preset" style="flex:1"><span>Start from</span>
        <select id="preset"></select></label>
    </div>
    <div class="row">
      <button id="importBtn" type="button">Import .JSN…</button>
      <input id="importFile" type="file" accept=".jsn,.JSN,.json,application/json" hidden>
    </div>
    <label for="name"><span>Theme name</span><input id="name" type="text" maxlength="24"></label>
    <label for="file"><span>File name (8.3)</span><input id="file" type="text" maxlength="8" style="width:120px;text-transform:uppercase"></label>
    <div id="colours"></div>
    <label for="radius"><span>Corner radius</span><input id="radius" type="range" min="0" max="28"></label>
    <label for="textScale"><span>Text size</span><input id="textScale" type="range" min="70" max="160" step="5"></label>
    <div class="row">
      <button id="download" class="primary" type="button">Download .JSN</button>
      <button id="copy" type="button">Copy JSON</button>
    </div>
    <p class="note" id="status" role="status"></p>
    <p class="note">Contrast matters on the camera's small screen in daylight: keep text clearly lighter or darker than the bar.</p>
  </section>
  <section class="preview" aria-label="Preview">
    <div class="screen-wrap" id="wrap">
      <div class="screen" id="screen">
        <div class="lv" aria-hidden="true"></div>
        <div class="pills"><span class="pill p">POS</span><span class="pill p">Live</span><span class="spacer"></span><span class="pill p">Base set</span><span class="pill p">2700 K · B2</span></div>
        <div class="bar" id="bar">
          <div class="menu" id="menu">Menu</div>
          <div class="mid">
            <div class="chips" id="chips"></div>
            <div class="sl"><div class="track" id="track"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div><span class="val" id="val">184</span></div>
          </div>
          <div class="shutter" id="shutter"><i id="disc"></i></div>
        </div>
      </div>
    </div>
    <pre id="json" aria-label="Theme JSON"></pre>
  </section>
</main>
<script>
// Built-in themes: keep in sync with Theme.builtIns() in the app. Colours are Android #AARRGGBB.
const PRESETS = [
  {name:"Minimal",accent:"#f2c14e",onAccent:"#0b0b0b",text:"#f2f2f2",textDim:"#b8b8b8",bar:"#c7080808",pill:"#8c000000",pillText:"#f2f2f2",chipBorder:"#3a3a3a",radius:12},
  {name:"Camera",accent:"#ff8a3d",onAccent:"#000000",text:"#ececec",textDim:"#bdbdbd",bar:"#eb000000",pill:"#cc141414",pillText:"#ececec",chipBorder:"#3a3a3a",radius:4},
  {name:"Material",accent:"#82d5c8",onAccent:"#00201b",text:"#e3e3e3",textDim:"#bec9c6",bar:"#f01d2321",pill:"#bf111414",pillText:"#e3e3e3",chipBorder:"#5b6563",radius:20},
  {name:"Glass",accent:"#ffd60a",onAccent:"#111111",text:"#ffffff",textDim:"#d0d0d0",bar:"#9e1c1c1e",pill:"#8c1e1e1e",pillText:"#ffffff",chipBorder:"#4dffffff",radius:24},
  {name:"Enlarger",accent:"#d1352b",onAccent:"#fff3f1",text:"#1e1e1e",textDim:"#3a3a3a",bar:"#f0bfc2c5",pill:"#cc2c2a26",pillText:"#e9c84a",chipBorder:"#5a5d61",radius:6},
  {name:"Light table",accent:"#d1242f",onAccent:"#ffffff",text:"#1d1d1d",textDim:"#4a4a4a",bar:"#f0f4f6f7",pill:"#e6f3e3b5",pillText:"#1d1d1d",chipBorder:"#2a2118",radius:3},
  {name:"Scope",accent:"#52e08a",onAccent:"#050505",text:"#d9d9d9",textDim:"#8a8a8a",bar:"#f0050505",pill:"#b3000000",pillText:"#52e08a",chipBorder:"#2c2c2c",radius:0},
  {name:"Safelight",accent:"#ff4a3d",onAccent:"#000000",text:"#ff4a3d",textDim:"#c0392b",bar:"#ff000000",pill:"#ff000000",pillText:"#ff4a3d",chipBorder:"#ff4a3d",radius:14},
];
const KEYS = [
  ["accent","Accent"],["onAccent","Text on accent"],["text","Text"],["textDim","Dim text"],
  ["bar","Bottom bar"],["pill","Status pills"],["pillText","Pill text"],["chipBorder","Borders / track"],
];
let t = {};

// Android #AARRGGBB / #RRGGBB <-> {rgb:"#rrggbb", a:0..255}
function parse(c){ c = String(c||"#000000").trim().toLowerCase();
  if(/^#[0-9a-f]{8}$/.test(c)) return {rgb:"#"+c.slice(3), a:parseInt(c.slice(1,3),16)};
  if(/^#[0-9a-f]{6}$/.test(c)) return {rgb:c, a:255};
  throw new Error("bad colour "+c); }
function android(rgb,a){ return a>=255 ? rgb : "#"+a.toString(16).padStart(2,"0")+rgb.slice(1); }
function css(c){ const p=parse(c); const n=parseInt(p.rgb.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${(p.a/255).toFixed(3)})`; }
function fileNameFrom(name){ return (name||"THEME").toUpperCase().replace(/[^A-Z0-9_]/g,"").slice(0,8)||"THEME"; }

function buildControls(){
  const box = document.getElementById("colours"); box.innerHTML = "";
  for(const [k,label] of KEYS){
    const id = "c_"+k, p = parse(t[k]);
    const row = document.createElement("label"); row.htmlFor = id;
    row.innerHTML = `<span>${label}</span><span class="colour"><input id="${id}" type="color" value="${p.rgb}">`+
      `<input id="${id}_a" type="range" min="0" max="255" value="${p.a}" aria-label="${label} opacity"><output id="${id}_o"></output></span>`;
    box.appendChild(row);
    const upd = () => { t[k] = android(document.getElementById(id).value, +document.getElementById(id+"_a").value); render(); };
    row.querySelector("#"+id).addEventListener("input", upd);
    row.querySelector("#"+id+"_a").addEventListener("input", upd);
  }
  document.getElementById("name").value = t.name;
  document.getElementById("file").value = fileNameFrom(t.name);
  document.getElementById("radius").value = t.radius;
  document.getElementById("textScale").value = Math.round((t.textScale||1)*100);
}

function render(){
  for(const [k] of KEYS){ const o=document.getElementById("c_"+k+"_o"); if(o) o.textContent = t[k]; }
  const r = t.radius, s = (t.textScale||1);
  document.getElementById("bar").style.background = css(t.bar);
  document.querySelectorAll(".p").forEach(p => { p.style.background = css(t.pill); p.style.color = css(t.pillText); p.style.fontSize = (13*s)+"px"; });
  const m = document.getElementById("menu"); m.style.color = css(t.text); m.style.borderColor = css(t.chipBorder); m.style.borderRadius = r+"px";
  const chips = document.getElementById("chips"); chips.innerHTML = "";
  ["Black","White","Gamma","Temp","A–B","G–M"].forEach((n,i) => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = n; c.style.fontSize = (13*s)+"px";
    c.style.borderRadius = Math.min(8,r)+"px";
    if(i===0){ c.style.background = css(t.accent); c.style.color = css(t.onAccent); c.style.borderColor = "transparent"; }
    else { c.style.background = "transparent"; c.style.color = css(t.textDim); c.style.borderColor = css(t.chipBorder); }
    chips.appendChild(c); });
  document.getElementById("track").style.background = css(t.chipBorder);
  document.getElementById("fill").style.background = css(t.accent);
  document.getElementById("thumb").style.background = css(t.text);
  const v = document.getElementById("val"); v.style.color = css(t.text); v.style.fontSize = (15*s)+"px";
  document.getElementById("shutter").style.borderColor = css(t.text);
  document.getElementById("disc").style.background = css(t.text);
  const out = {name:t.name}; for(const [k] of KEYS) out[k]=t[k]; out.radius=+t.radius; out.textScale=+(t.textScale||1).toFixed(2);
  document.getElementById("json").textContent = JSON.stringify(out, null, 2);
  fit();
}

function fit(){ const w = document.getElementById("wrap").clientWidth, sc = Math.min(1, w/640);
  const s = document.getElementById("screen"); s.style.transform = `scale(${sc})`; document.getElementById("wrap").style.height = (480*sc)+"px"; }

function load(obj){ const base = PRESETS[0]; t = Object.assign({}, base, obj); for(const [k] of KEYS) parse(t[k]); buildControls(); render(); }

const sel = document.getElementById("preset");
PRESETS.forEach((p,i) => { const o=document.createElement("option"); o.value=i; o.textContent=p.name; sel.appendChild(o); });
sel.addEventListener("change", () => load(Object.assign({}, PRESETS[+sel.value], {name: PRESETS[+sel.value].name+" custom"})));
document.getElementById("name").addEventListener("input", e => { t.name = e.target.value || "Untitled"; document.getElementById("file").value = fileNameFrom(t.name); render(); });
document.getElementById("file").addEventListener("input", e => { e.target.value = fileNameFrom(e.target.value); });
document.getElementById("radius").addEventListener("input", e => { t.radius = +e.target.value; render(); });
document.getElementById("textScale").addEventListener("input", e => { t.textScale = +e.target.value/100; render(); });
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try { load(JSON.parse(await f.text())); status("Imported "+f.name); } catch(err){ status("Could not read "+f.name+": "+err.message); } });
function status(s){ document.getElementById("status").textContent = s; }
document.getElementById("download").addEventListener("click", () => {
  const name = fileNameFrom(document.getElementById("file").value)+".JSN";
  const blob = new Blob([document.getElementById("json").textContent], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  status("Saved "+name+". Copy it to FILMINV/THEMES/ on the card, then Menu › Theme on the camera."); });
document.getElementById("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(document.getElementById("json").textContent); status("JSON copied"); }
  catch { status("Copy failed: select the JSON text and copy it by hand"); } });
window.addEventListener("resize", fit);
load(Object.assign({}, PRESETS[0], {name:"My theme"}));
</script>
</body>
</html>
